<div class="request-details-container">
  <div class="custom-tab-header">
    <div class="tab-item active">Thông tin</div>
    <div class="tab-item">Lịch sử</div>
    <div class="tab-item">Tài liệu</div>
  </div>

  <form nz-form [nzLayout]="'vertical'" class="request-form">
    <div nz-row [nzGutter]="24">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzRequired>Đơn vị:</nz-form-label>
          <nz-form-control>
            <nz-input-group>
              <input nz-input placeholder="PETROLIMEX-CH 01" readonly/>
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Trạng thái:</nz-form-label>
          <nz-form-control>
              <nz-input-group>
              <input nz-input placeholder="Đang thực hiện" readonly/>
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label nzRequired>Tên yêu cầu:</nz-form-label>
          <nz-form-control>
            <input nz-input placeholder="Sửa chữa màn hình cột bơm (MH100)" readonly/>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Người phụ trách:</nz-form-label>
          <nz-form-control>
            <nz-select nzDefaultValue="userA">
              <nz-option nzValue="userA" nzLabel="Nguyễn Văn A"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="24">
        <nz-form-item>
          <nz-form-label>Mô tả chi tiết:</nz-form-label>
          <nz-form-control>
            <textarea nz-input rows="3">Bảo trì hệ thống điều hòa tại khu vực tầng 2 tòa B</textarea>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Định mức sửa chữa:</nz-form-label>
          <nz-form-control>
            <nz-select nzDefaultValue="repair1">
              <nz-option nzValue="repair1" nzLabel="Sửa chữa màn hình cột bơm (MH 100)"></nz-option>
              <nz-option nzValue="repair2" nzLabel="Thay dầu"></nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Mức độ ưu tiên:</nz-form-label>
          <nz-form-control>
            <nz-select nzDefaultValue="high">
              <nz-option nzCustomContent nzValue="high" nzLabel="Cao">
                <span class="priority-high">Cao</span>
              </nz-option>
              <nz-option nzCustomContent nzValue="high" nzLabel="Cao">
                <span class="priority-high">Trung bình</span>
              </nz-option>
              <nz-option nzCustomContent nzValue="high" nzLabel="Cao">
                <span class="priority-high">Thấp</span>
              </nz-option>
            </nz-select>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Ngày bắt đầu:</nz-form-label>
          <nz-form-control>
            <nz-date-picker class="full-width" nzFormat="MM/dd/yyyy"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>

      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Ngày kết thúc:</nz-form-label>
          <nz-form-control>
            <nz-date-picker class="full-width" nzFormat="MM/dd/yyyy"></nz-date-picker>
          </nz-form-control>
        </nz-form-item>
      </div>
    </div>
  </form>
</div>
