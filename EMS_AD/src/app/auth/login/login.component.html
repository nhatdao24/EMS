<div class="login-container">
  <div class="background-layers">
    <img class="bg-layer" src="/img/background_1.jpg.jpeg" >
  </div>

  <!-- Phần mới: Form đăng nhập -->
  <div class="login-form-container">
    <div class="login-card">

      <!-- Form đăng nhập -->
      <div class="login-form-content">

        <div class="login-header">
          
          <div class="header-logo" aria-hidden="true"></div>
          <div class="header-brand-text" style="color: bg-blue;"> EMS</div>

        </div>

        <h2 class="form-title">Đăng nhập</h2>

        <form (ngSubmit)="onFormSubmit($event)" novalidate autocomplete="off">
          <!-- Hiển thị thông tin người dùng (ô tên đăng nhập có icon) -->
          <div class="user-info-section">
            <div class="input-wrapper">
              <span class="input-icon">
                <!-- Simpler person icon for username -->
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z"
                    stroke="#9CA3AF"
                    stroke-width="1.33333"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3 21c0-3.866 3.582-7 9-7s9 3.134 9 7"
                    stroke="#9CA3AF"
                    stroke-width="1.33333"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <input
                #autofillInput
                type="text"
                name="username"
                [(ngModel)]="model.userName"
                class="email-input"
                placeholder="Tên đăng nhập"
                aria-label="Tên đăng nhập"
              />
            </div>
          </div>

          <!-- Ô mật khẩu -->
          <div class="password-input-section">
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M4 7.33333V4.66667C4 2.45753 5.79086 0.666667 8 0.666667C10.2091 0.666667 12 2.45753 12 4.66667V7.33333M2.66667 7.33333H13.3333C14.0697 7.33333 14.6667 7.93029 14.6667 8.66667V13.3333C14.6667 14.0697 14.0697 14.6667 13.3333 14.6667H2.66667C1.93029 14.6667 1.33333 14.0697 1.33333 13.3333V8.66667C1.33333 7.93029 1.93029 7.33333 2.66667 7.33333Z"
                    stroke="#9CA3AF"
                    stroke-width="1.33333"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
              <input
                #autofillPassword
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                [(ngModel)]="model.password"
                class="password-input"
                placeholder="Password"
                aria-label="Password"
              />
              <button
                type="button"
                class="password-toggle"
                (click)="togglePassword(); $event.preventDefault()"
                [attr.aria-pressed]="showPassword"
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M8 3.33333C11.3333 3.33333 14 8 14 8S11.3333 12.6667 8 12.6667S2 8 2 8S4.66667 3.33333 8 3.33333Z"
                    stroke="#9CA3AF"
                    stroke-width="1.33333"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="8"
                    cy="8"
                    r="2"
                    stroke="#9CA3AF"
                    stroke-width="1.33333"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Ghi nhớ mật khẩu -->
          <div class="form-options-section">
            <label class="remember-wrapper">
              <input
                type="checkbox"
                name="remember"
                class="remember-checkbox"
              />
              <span class="remember-label">Nhớ mật khẩu</span>
            </label>
            <a href="#" class="forgot-password-link">Quên mật khẩu ?</a>
          </div>

          <!-- Nút đăng nhập -->
          <button type="submit" class="login-btn">Đăng nhập</button>

          <!-- Chân trang -->
          <div class="login-footer">
            <!-- <div class="footer-brand">
              <div class="footer-logo" aria-hidden="true"></div>
              <div class="footer-brand-text">EMS</div>
            </div> -->
            <span class="footer-copyright">© 2026 d2s.com.vn</span>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
